name: Android CI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - car/android-auto

env:
  RUST_TARGETS: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (Google action)
        uses: google-github-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: '33.0.2'
          # platform-tools and platforms will be installed by the action

      - name: Install Android NDK (r27c)
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" >/dev/null
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Gradle & Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-build-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Install rustup and toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env
          rustup default stable
          rustup target add $RUST_TARGETS
          cargo install --locked cargo-ndk || true
        env:
          CARGO_HOME: ${{ env.HOME }}/.cargo

      - name: Write google-services.json from secret (if provided)
        run: |
          set -euo pipefail
          mkdir -p app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "Using GOOGLE_SERVICES_JSON_BASE64 to write app/google-services.json"
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json
            echo "Wrote app/google-services.json (from base64 secret)"
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON_RAW }}" ]; then
            echo "Using GOOGLE_SERVICES_JSON_RAW to write app/google-services.json"
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON_RAW }}" > app/google-services.json
            echo "Wrote app/google-services.json (from raw secret)"
          else
            echo "No google-services secret found (GOOGLE_SERVICES_JSON_BASE64 or GOOGLE_SERVICES_JSON_RAW) — skipping"
          fi

      - name: Build APK (assembleDebug)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCar_AI-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
